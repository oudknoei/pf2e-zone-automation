name: Release Foundry module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build compendia from source JSON
        run: pnpm run build:packs
      - name: Verify module
        run: |
          node --test tests/*.mjs
          for file in scripts/*.js; do node --check "$file"; done
      - name: Package Foundry release
        run: python3 tools/package-release.py --tag "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/module.json dist/module.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/module.json dist/module.zip --verify-tag --generate-notes
          fi
