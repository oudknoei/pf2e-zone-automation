name: Verify Foundry module

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build compendia from source JSON
        run: pnpm run build:packs
      - name: Check undefined variables
        run: pnpm run lint
      - name: Run module tests
        run: pnpm test
